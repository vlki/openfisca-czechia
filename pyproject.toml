[project]
name = "openfisca-czechia"
version = "0.1.2"
description = "Czech tax and benefit model for OpenFisca"
readme = "README.md"
keywords = ["microsimulation", "tax", "benefit", "rac", "rules-as-code", "czechia"]
authors = [
    {name = "Jan Vlcek", email = "jan.vlcek@vlki.cz"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">= 3.9"
dependencies = [
    "openfisca-core[web-api] >= 44.0.0, < 45",
    "numpy >= 1.26.0, < 2.5.0"
]

[project.urls]
Homepage = "https://github.com/vlki/openfisca-czechia"
Repository = "https://github.com/vlki/openfisca-czechia"
Issues = "https://github.com/vlki/openfisca-czechia/issues"
Changelog = "https://github.com/vlki/openfisca-czechia/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff >= 0.15.20",
    "yamllint >= 1.35.1"
]

[tool.pytest.ini_options]
addopts = "--showlocals --doctest-modules"
testpaths = [ "openfisca_czechia/tests" ]
python_files = "**/*.py"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    'ignore:function ham\(\) is deprecated:DeprecationWarning'
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PL"]
ignore = ["E501"]        # no max line length enforced (as before)

[tool.ruff.lint.isort]
section-order = ["future", "typing", "standard-library", "third-party", "openfisca", "first-party", "local-folder"]
known-first-party = ["openfisca_czechia"]

[tool.ruff.lint.isort.sections]
typing = ["typing", "typing_extensions"]
openfisca = ["openfisca_core"]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["openfisca_czechia*"]
