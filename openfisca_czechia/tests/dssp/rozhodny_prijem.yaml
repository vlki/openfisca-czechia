- name: Všechny příjmy zahrnuté do rozhodného příjmu pro DSSP
  absolute_error_margin: 0.01
  period: 2026-01
  input:
    osoby:
      dospely1:
        cisty_pracovni_prijem_osoby: 30000
      dospely2:
        starobni_duchod: 1000
        materska: 1000
        nemocenska: 1000
        odmena_pestouna: 1000
        podpora_v_nezamestnanosti: 1000
        rodicovsky_prispevek: 10000
        vyzivne_na_deti: 3000
    domacnosti:
      domacnost:
        clenove: [dospely1, dospely2]
  output:
    domacnost:
      dssp_rozhodny_prijem: 48000

- name: Do rozhodného příjmu pro DSSP se nezahrnují příjmy nezaopatřených dětí
  absolute_error_margin: 0.01
  period: 2026-01
  input:
    osoby:
      dospely1:
        cisty_pracovni_prijem_osoby: 30000
      dospely2:
        cisty_pracovni_prijem_osoby: 20000
      dite1:
        je_nezaopatrene_dite: true
        cisty_pracovni_prijem_osoby: 15000
    domacnosti:
      domacnost:
        clenove: [dospely1, dospely2, dite1]
  output:
    domacnost:
      dssp_rozhodny_prijem: 50000

- name: Záporný čistý pracovní příjem se do rozhodného příjmu započte jako nula (leden 2026)
  absolute_error_margin: 0.01
  period: 2026-01
  input:
    osoby:
      dospely1:
        # Doplatek do minimálního zdravotního pojištění převyšuje mzdu, takže
        # čistý pracovní příjem vychází -2005 Kč
        hruby_prijem_ze_zamestnani_1: 1000
    domacnosti:
      domacnost:
        clenove: [dospely1]
  output:
    domacnost:
      dssp_rozhodny_prijem: 0

- name: Záporný čistý pracovní příjem nesnižuje příjmy ostatních členů domácnosti (leden 2026)
  absolute_error_margin: 0.01
  period: 2026-01
  input:
    osoby:
      dospely1:
        hruby_prijem_ze_zamestnani_1: 1000
      dospely2:
        starobni_duchod: 20000
    domacnosti:
      domacnost:
        clenove: [dospely1, dospely2]
  output:
    domacnost:
      # Podle § 4 odst. 3 zákona 151/2025 Sb. nelze příjem snížit o ztrátu
      # z jiného druhu příjmů, důchod tedy zůstává celý
      dssp_rozhodny_prijem: 20000
