- name: Všechny příjmy zahrnuté do příjmu zohledňovaného pro pracovní bonus pro DSSP (leden 2026)
  absolute_error_margin: 0.01
  period: 2026-01
  input:
    osoby:
      dospely1:
        cisty_pracovni_prijem_osoby: 30000
      dospely2:
        starobni_duchod: 1000
        invalidni_vdovecky_sirotci_duchody: 2000
        materska: 3000
        nemocenska: 4000
        odmena_pestouna: 5000
        podpora_v_nezamestnanosti: 6000
        prispevek_na_uhradu_potreb_na_dite: 7000
        rodicovsky_prispevek: 8000
        vyzivne_na_deti: 9000
        navazuje_rodicovsky_prispevek_na_materskou: true
    domacnosti:
      domacnost:
        clenove: [dospely1, dospely2]
  output:
    domacnost:
      # 30000 + 4000 + 5000 + 8000
      dssp_prijem_zohlednovany_pro_pracovni_bonus: 47000

