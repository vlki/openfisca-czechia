- name: Jednočlenná domácnost využívající tuhá paliva s rozhodným příjem pod hranicí, pod kterou se aplikuje částka za tuhá
  period: 2026-01
  input:
    osoby:
      dospely1:
        cisty_prijem_osoby: 6000
        dssp_je_osoba_pracovne_aktivni: true
        dssp_je_osoba_zranitelna: false
    domacnosti:
      domacnost:
        clenove: [dospely1]
        dssp_velikost_obce_bydliste: praha_a_brno
        naklady_na_energie: 5000
        vyuziva_domacnost_tuha_paliva: true
  output:
    domacnost:
      dssp_naklady_na_energie: 6500

