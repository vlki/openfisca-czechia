- name: Jednočlenná pracovně aktivní domácnost s rozhodným příjmem pod hranicí pro započítání složky (leden 2026)
  period: 2026-01
  input:
    osoby:
      dospely1:
        cisty_prijem_osoby: 6000
        dssp_je_osoba_pracovne_aktivni: true
    domacnosti:
      domacnost:
        clenove: [dospely1]
  output:
    domacnost:
      # 4860 - (6000 - (6000 * 0.3))
      dssp_slozka_na_zivobyti: 660
  absolute_error_margin: 0.01

