    hruby_prijem_ze_zamestnani_1: 7000
    typ_pracovni_smlouvy_zamestnani_1: dpp
    hruby_prijem_ze_zamestnani_2: 6000
    typ_pracovni_smlouvy_zamestnani_2: dpp
    podepsane_prohlaseni_u_zamestnavatele: zadny
