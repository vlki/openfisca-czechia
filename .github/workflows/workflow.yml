name: Build, lint and test

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ assigned, opened, reopened, synchronize, ready_for_review ]
  workflow_dispatch:


env:
  DEFAULT_PYTHON_VERSION: &upper_pyver 3.13.16
  MIN_PYTHON_VERSION: &min_pyver 3.10.20

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: [*min_pyver, *upper_pyver]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Cache build
        id: restore-build
        uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: build-${{ env.UV_CACHE_DIR }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ env.UV_CACHE_DIR }}-${{ hashFiles('pyproject.toml') }}
            build-${{ env.UV_CACHE_DIR }}-
      - name: Build package
        run: make build
      - name: Cache release
        id: restore-release
        uses: actions/cache@v6
        with:
          path: dist
          key: release-${{ env.UV_CACHE_DIR }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}

  lint-files:
    runs-on: ubuntu-24.04
    needs: [ build ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all the tags
      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          activate-environment: true
      - name: Cache build
        id: restore-build
        uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: build-${{ env.UV_CACHE_DIR }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
      - run: make check-style
      # - name: Lint Python files
      #   run: "${GITHUB_WORKSPACE}/.github/lint-changed-python-files.sh"
      # - name: Lint YAML tests
      #   run: "${GITHUB_WORKSPACE}/.github/lint-changed-yaml-tests.sh"

  test-yaml:
    runs-on: ubuntu-24.04
    needs: [ build ]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          activate-environment: true
      - name: Cache build
        id: restore-build
        uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: build-${{ env.UV_CACHE_DIR }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
      - run: openfisca test --country-package openfisca_czechia openfisca_czechia/tests

